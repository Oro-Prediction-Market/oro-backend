name: backend → prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-prod
  cancel-in-progress: true

env:
  IMAGE: harbor.oro.fun/oro/backend
  NS: prod
  DEPLOY: oro-backend

jobs:
  ship:
    runs-on: [self-hosted, oro]
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup kubeconfig
        run: |
          mkdir -p $RUNNER_TEMP/.kube
          echo '${{ secrets.KUBECONFIG }}' | base64 -d > $RUNNER_TEMP/.kube/config
          chmod 600 $RUNNER_TEMP/.kube/config
          echo "KUBECONFIG=$RUNNER_TEMP/.kube/config" >> $GITHUB_ENV

      - name: Login to Harbor
        run: |
          echo '${{ secrets.HARBOR_PASSWORD }}' | docker login harbor.oro.fun \
            -u '${{ secrets.HARBOR_USERNAME }}' --password-stdin

      - name: Build + push
        env:
          TAG: ${{ github.sha }}
        run: |
          docker build -t $IMAGE:$TAG -t $IMAGE:latest .
          docker push $IMAGE:$TAG
          docker push $IMAGE:latest

      - name: Check optional feature config
        run: |
          warn() { echo "::warning::$1 is not set — the feature it gates will refuse at runtime."; }
          [ -n '${{ secrets.GOOGLE_CLIENT_ID }}' ]    || warn "GOOGLE_CLIENT_ID (Google sign-in)"
          [ -n '${{ vars.MINIO_ENDPOINT }}${{ secrets.MINIO_ENDPOINT }}' ] || warn "MINIO_ENDPOINT (document storage)"
          if [ '${{ vars.USDT_ENABLED }}${{ secrets.USDT_ENABLED }}' = 'true' ]; then
            [ -n '${{ secrets.TWENTY_ONE_PAY_API }}' ] \
              || warn "TWENTY_ONE_PAY_API — USDT is enabled but there is no API token, so every call to 21 Pay will fail"
            [ -n '${{ secrets.TWENTYONE_PAY_WEBHOOK_SECRET }}' ] \
              || warn "TWENTYONE_PAY_WEBHOOK_SECRET — deposits will only be credited by the 60s fallback poller"
            [ -n '${{ vars.TWENTYONE_PAY_NETWORKS }}${{ secrets.TWENTYONE_PAY_NETWORKS }}' ] \
              || warn "TWENTYONE_PAY_NETWORKS — unset means no chains are offered and no deposit can start"
          fi

          # `vars` first, then `secrets` — same as the other two below. Reading
          # only one of them meant the value was invisible if it happened to be
          # stored as the other kind, and the deploy warned that a variable you
          # had set was missing.
          BASE='${{ vars.TWENTYONE_PAY_BASE_URL || secrets.TWENTYONE_PAY_BASE_URL }}'
          if [ -z "$BASE" ]; then
            # Only worth mentioning when the rail is switched on. With
            # USDT_ENABLED unset or false, nothing calls 21 Pay and the absence
            # is simply the current state of the world, not a problem.
            if [ '${{ vars.USDT_ENABLED }}${{ secrets.USDT_ENABLED }}' = 'true' ]; then
              warn "TWENTYONE_PAY_BASE_URL — USDT is enabled but there is no API base URL, so no call can be made"
            fi
          elif ! echo "$BASE" | grep -q '/v1$'; then
            # Without the prefix every call lands on their web console, which
            # answers 404 with an HTML page — it reads as a missing endpoint
            # when it is a missing path segment. That cost real time once.
            echo "::error::TWENTYONE_PAY_BASE_URL must end in /v1 — got '$BASE'."
            exit 1
          fi

      - name: Sync prod Secret (live values from cluster + GH secrets)
        run: |
          DB_PASSWORD="$(kubectl -n database get secret oro-pg-app -o jsonpath='{.data.password}' | base64 -d)"
          REDIS_QUEUE_PASSWORD="$(kubectl -n redis get secret redis-queue -o jsonpath='{.data.redis-password}' | base64 -d)"

          # Neither of these is a secret, so a repo Variable is the right home:
          # Actions masks a secret's literal value everywhere it appears, which
          # would turn `USDT_ENABLED` into `***` in the logs and blank out the
          # word "tron" in any line that mentions it. Read from `vars` first,
          # falling back to `secrets` so it works either way.
          PAY21_BASE_URL='${{ vars.TWENTYONE_PAY_BASE_URL || secrets.TWENTYONE_PAY_BASE_URL }}'
          USDT_NETWORKS='${{ vars.TWENTYONE_PAY_NETWORKS || secrets.TWENTYONE_PAY_NETWORKS }}'
          # Defaults to off. The rail going live should be a deliberate act,
          # not something that follows from forgetting to set a variable.
          USDT_ENABLED='${{ vars.USDT_ENABLED || secrets.USDT_ENABLED || 'false' }}'

          # MinIO credentials, preferring what the cluster already holds.
          #
          # Same pattern as Postgres and Redis above: if MinIO runs in this
          # cluster its own Secret is the source of truth, and copying the keys
          # into GitHub would mean two places to rotate. Falls back to GitHub
          # secrets for a MinIO hosted elsewhere.
          MINIO_ENDPOINT='${{ vars.MINIO_ENDPOINT || secrets.MINIO_ENDPOINT }}'
          MINIO_ACCESS_KEY="$(kubectl -n minio get secret minio -o jsonpath='{.data.root-user}' 2>/dev/null | base64 -d || true)"
          MINIO_SECRET_KEY="$(kubectl -n minio get secret minio -o jsonpath='{.data.root-password}' 2>/dev/null | base64 -d || true)"
          if [ -z "$MINIO_ACCESS_KEY" ]; then
            MINIO_ENDPOINT='${{ secrets.MINIO_ENDPOINT }}'
            MINIO_ACCESS_KEY='${{ secrets.MINIO_ACCESS_KEY }}'
            MINIO_SECRET_KEY='${{ secrets.MINIO_SECRET_KEY }}'
          fi

          kubectl create secret generic oro-secrets --namespace=$NS \
            --dry-run=client -o yaml \
            --from-literal=DB_HOST=oro-pg-rw.database.svc.cluster.local \
            --from-literal=DB_PORT=5432 \
            --from-literal=DB_NAME=oro_db \
            --from-literal=DB_USERNAME=oro \
            --from-literal=DB_MIGRATIONS_RUN=true \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=REDIS_URL="redis://default:${REDIS_QUEUE_PASSWORD}@redis-queue-master.redis.svc.cluster.local:6379" \
            --from-literal=JWT_SECRET='${{ secrets.JWT_SECRET }}' \
            --from-literal=TELEGRAM_BOT_TOKEN='${{ secrets.TELEGRAM_BOT_TOKEN }}' \
            --from-literal=TELEGRAM_WEBHOOK_SECRET='${{ secrets.TELEGRAM_WEBHOOK_SECRET }}' \
            --from-literal=TELEGRAM_WEBHOOK_URL='https://api.oro.fun/api/bot/webhook' \
            --from-literal=TELEGRAM_MINI_APP_URL='https://oro.fun' \
            --from-literal=TELEGRAM_CHANNEL_ID='${{ secrets.TELEGRAM_CHANNEL_ID }}' \
            --from-literal=TELEGRAM_CHANNEL_URL='${{ secrets.TELEGRAM_CHANNEL_URL }}' \
            --from-literal=FOOTBALL_DATA_API_KEY='${{ secrets.FOOTBALL_DATA_API_KEY }}' \
            --from-literal=ADMIN_TELEGRAM_ID='${{ secrets.ADMIN_TELEGRAM_ID }}' \
            --from-literal=ADMIN_TOTP_SECRET='${{ secrets.ADMIN_TOTP_SECRET }}' \
            --from-literal=ADMIN_DEV_SECRET='${{ secrets.ADMIN_DEV_SECRET }}' \
            --from-literal=PHONE_HASH_SECRET='${{ secrets.PHONE_HASH_SECRET }}' \
            --from-literal=DK_API_KEY='${{ secrets.DK_API_KEY }}' \
            --from-literal=DK_BANK_CODE='${{ secrets.DK_BANK_CODE }}' \
            --from-literal=DK_BENEFICIARY_ACCOUNT='${{ secrets.DK_BENEFICIARY_ACCOUNT }}' \
            --from-literal=DK_CLIENT_ID='${{ secrets.DK_CLIENT_ID }}' \
            --from-literal=DK_CLIENT_SECRET='${{ secrets.DK_CLIENT_SECRET }}' \
            --from-literal=DK_PASSWORD='${{ secrets.DK_PASSWORD }}' \
            --from-literal=DK_SOURCE_APP='${{ secrets.DK_SOURCE_APP }}' \
            --from-literal=DK_USERNAME='${{ secrets.DK_USERNAME }}' \
            --from-literal=BHUTANAPP_JWT_PUBLIC_KEY='${{ secrets.BHUTANAPP_JWT_PUBLIC_KEY }}' \
            --from-literal=BHUTANAPP_NOTIFICATION_AUTH_TOKEN='${{ secrets.BHUTANAPP_NOTIFICATION_AUTH_TOKEN }}' \
            --from-literal=BHUTANAPP_NOTIFICATION_SERVICE_URL='${{ secrets.BHUTANAPP_NOTIFICATION_SERVICE_URL }}' \
            --from-literal=EMAIL_SMTP_PASSWORD='${{ secrets.EMAIL_SMTP_PASSWORD }}' \
            --from-literal=SMS_PASSWORD='${{ secrets.SMS_PASSWORD }}' \
            --from-literal=GOOGLE_CLIENT_ID='${{ secrets.GOOGLE_CLIENT_ID }}' \
            --from-literal=TWENTYONE_PAY_BASE_URL="$PAY21_BASE_URL" \
            --from-literal=TWENTY_ONE_PAY_API='${{ secrets.TWENTY_ONE_PAY_API }}' \
            --from-literal=TWENTYONE_PAY_WEBHOOK_SECRET='${{ secrets.TWENTYONE_PAY_WEBHOOK_SECRET }}' \
            --from-literal=TWENTYONE_PAY_NETWORKS="$USDT_NETWORKS" \
            --from-literal=USDT_ENABLED="$USDT_ENABLED" \
            --from-literal=MINIO_ENDPOINT="$MINIO_ENDPOINT" \
            --from-literal=MINIO_ACCESS_KEY="$MINIO_ACCESS_KEY" \
            --from-literal=MINIO_SECRET_KEY="$MINIO_SECRET_KEY" \
            --from-literal=MINIO_KYC_BUCKET='${{ vars.MINIO_KYC_BUCKET || 'oro-kyc' }}' \
            --from-literal=MINIO_USE_SSL='${{ vars.MINIO_USE_SSL || 'false' }}' \
            | kubectl apply -f -

      # Migrations run in the pod at startup, under a Postgres advisory lock
      # (see src/main.ts). `DB_MIGRATIONS_RUN=true` in the Secret above turns
      # it on; the lock is what makes it safe with more than one replica, and
      # a pod refuses to serve traffic if a migration fails. No separate Job.
      - name: Roll deployment
        env:
          TAG: ${{ github.sha }}
        run: |
          kubectl -n $NS set image deployment/$DEPLOY backend=$IMAGE:$TAG
          kubectl -n $NS rollout status deployment/$DEPLOY --timeout=300s

      - name: Show new pod state
        if: always()
        run: |
          kubectl -n $NS get pods -l app=$DEPLOY -o wide
          kubectl -n $NS get deploy $DEPLOY
